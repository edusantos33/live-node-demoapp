name: Security checks

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  security:
    name: Test, SAST, SCA and secrets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Syntax check
        run: npm run lint

      - name: Automated tests
        run: npm test

      - name: Setup reviewdog
        if: github.event_name == 'pull_request'
        uses: reviewdog/action-setup@v1
        with:
          reviewdog_version: latest

      - name: Bearer SAST report for PR review
        id: bearer
        uses: bearer/bearer-action@v2
        env:
          BEARER_FAIL_ON_SEVERITY: critical,high
        with:
          path: .
          scanner: sast
          severity: critical,high
          format: rdjson
          output: rd.json
          diff: ${{ github.event_name == 'pull_request' }}

      - name: Run reviewdog
        if: always() && github.event_name == 'pull_request'
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f rd.json ]; then
            cat rd.json | reviewdog -f=rdjson -reporter=github-pr-review
          else
            echo "rd.json not found. Bearer may have failed before generating the report."
          fi

      - name: Upload Bearer SAST report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bearer-sast-rdjson-report
          path: rd.json

      - name: OWASP Dependency-Check SCA - block high and critical CVSS
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: ghscd-live-node-demoapp
          path: .
          format: HTML
          out: reports
          args: >
            --failOnCVSS 7
            --enableRetired
            --scan package.json
            --scan node_modules

      - name: Upload Dependency-Check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: reports

      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
